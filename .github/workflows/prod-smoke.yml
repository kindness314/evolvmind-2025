name: Prod Smoke
on: workflow_dispatch
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: models(暴露当前 base_url 指向)
        run: |
          curl -s --connect-timeout 15 -m 30 https://evolvmind-2025.vercel.app/api/models \
            -H "x-evolvmind-demo: true" -w "\n[models] HTTP %{http_code}\n" | head -c 500
      - name: extract
        run: |
          curl -s --connect-timeout 15 -m 45 -X POST https://evolvmind-2025.vercel.app/api/extract \
            -H "Content-Type: application/json" -H "x-evolvmind-demo: true" \
            -d '{"content":"测试:今天学了二分查找。"}' \
            -w "\n[extract] HTTP %{http_code} in %{time_total}s\n" | head -c 400
