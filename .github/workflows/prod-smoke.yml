name: Prod Smoke
on: workflow_dispatch
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: deepseek official API reachable from US
        run: |
          curl -s --connect-timeout 15 -X POST https://api.deepseek.com/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer sk-invalid-test" \
            -d '{"model":"deepseek-chat","messages":[{"role":"user","content":"hi"}]}' \
            -w "\nHTTP %{http_code} in %{time_total}s\n" | head -c 400
