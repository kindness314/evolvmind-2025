name: Prod Smoke
on: workflow_dispatch
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: check deployed frontend has swipe-back
        run: |
          set -e
          HTML=$(curl -s https://evolvmind-2025.vercel.app/)
          echo "$HTML" | grep -o 'src="[^"]*index[^"]*\.js"' | head -2
          JS=$(echo "$HTML" | grep -o '/assets/[^"]*index[^"]*\.js' | head -1)
          echo "bundle: $JS"
          curl -s "https://evolvmind-2025.vercel.app$JS" -o main.js
          echo "size: $(wc -c < main.js)"
          grep -c "evolvmind" main.js || true
          grep -o "pushState" main.js | wc -l
          grep -o "popstate" main.js | wc -l
