name: Prod Smoke
on: workflow_dispatch
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: graph extract hasKey
        run: |
          curl -s --connect-timeout 15 -m 30 "https://evolvmind-2025.vercel.app/api/graph/extract" \
            -H "x-evolvmind-demo: true" -w "\n[hasKey-check] HTTP %{http_code}\n" | head -c 300
