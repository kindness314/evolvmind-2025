name: Prod Smoke
on: workflow_dispatch
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: overseas + correct model + valid key
        run: |
          curl -s --connect-timeout 15 -X POST https://api.edgefn.net/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.EDGEFN_TEST_KEY }}" \
            -d '{"model":"MiniMax-M2.5","messages":[{"role":"user","content":"hi"}]}' \
            -w "\nHTTP %{http_code} in %{time_total}s\n" | head -c 400
