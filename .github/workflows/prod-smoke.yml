name: Prod Smoke
on: workflow_dispatch
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: 真 key 直连 deepseek-flash
        run: |
          curl -s --connect-timeout 10 -m 40 -X POST https://api.deepseek.com/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.DS_TEST_KEY }}" \
            -d '{"model":"deepseek-flash","messages":[{"role":"user","content":"回复一个字:好"}],"max_tokens":10}' \
            -w "\n[realkey-flash] HTTP %{http_code} in %{time_total}s\n" | head -c 300
      - name: 真 key 直连 deepseek-chat(旧名)
        run: |
          curl -s --connect-timeout 10 -m 40 -X POST https://api.deepseek.com/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.DS_TEST_KEY }}" \
            -d '{"model":"deepseek-chat","messages":[{"role":"user","content":"回复一个字:好"}],"max_tokens":10}' \
            -w "\n[realkey-oldchat] HTTP %{http_code} in %{time_total}s\n" | head -c 300
