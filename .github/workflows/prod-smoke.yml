name: Prod Smoke
on: workflow_dispatch
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: extract (demo)
        run: |
          curl -s --connect-timeout 15 -X POST https://evolvmind-2025.vercel.app/api/extract \
            -H "Content-Type: application/json" -H "x-evolvmind-demo: true" \
            -d '{"content":"测试:今天学了二分查找,要点是排序后每次折半缩小范围。"}' \
            -w "\nHTTP %{http_code} in %{time_total}s\n" | head -c 500
