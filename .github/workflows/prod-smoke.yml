name: Prod Smoke
on: workflow_dispatch
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: SF chat deepseek V3.1
        run: |
          curl -s --connect-timeout 10 -m 40 -X POST https://api.siliconflow.cn/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.SF_TEST_KEY }}" \
            -d '{"model":"deepseek-ai/DeepSeek-V3.1","messages":[{"role":"user","content":"回复一个字:好"}],"max_tokens":10}' \
            -w "\n[sf-v31] HTTP %{http_code} in %{time_total}s\n" | head -c 300
      - name: SF 模型列表确认 ID
        run: |
          curl -s --connect-timeout 10 -m 20 https://api.siliconflow.cn/v1/models \
            -H "Authorization: Bearer ${{ secrets.SF_TEST_KEY }}" | grep -o '"id":"[^"]*"' | grep -iE "deepseek|qwen" | head -8
