name: Prod Smoke
on: workflow_dispatch
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: recommend (demo)
        run: |
          curl -s --connect-timeout 20 -m 120 -X POST https://evolvmind-2025.vercel.app/api/recommend \
            -H "Content-Type: application/json" -H "x-evolvmind-demo: true" \
            -d '{"count":5}' \
            -w "\n[recommend] HTTP %{http_code} in %{time_total}s\n" | head -c 1200
      - name: summarize 7d (demo)
        run: |
          curl -s --connect-timeout 20 -m 300 -X POST https://evolvmind-2025.vercel.app/api/summarize \
            -H "Content-Type: application/json" -H "x-evolvmind-demo: true" \
            -d '{"period":"7d"}' \
            -w "\n[summarize] HTTP %{http_code} in %{time_total}s\n" | head -c 1500
