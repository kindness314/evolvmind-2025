name: Prod Smoke
on: workflow_dispatch
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: edgefn headers
        run: |
          curl -sv --connect-timeout 15 -X POST https://api.edgefn.net/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer test" \
            -d '{}' 2>&1 | grep -E "^< |HTTP|server|x-|via" | head -25
