name: Prod Smoke
on: workflow_dispatch
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: deepseek chat 新模型名端点测试(假 key,401=通)
        run: |
          curl -s --connect-timeout 10 -m 20 -X POST https://api.deepseek.com/chat/completions \
            -H "Content-Type: application/json" -H "Authorization: Bearer sk-invalid" \
            -d '{"model":"deepseek-flash","messages":[{"role":"user","content":"hi"}]}' \
            -w "\n[flash] HTTP %{http_code} in %{time_total}s\n" | head -c 200
      - name: deepseek chat 旧模型名对照
        run: |
          curl -s --connect-timeout 10 -m 20 -X POST https://api.deepseek.com/chat/completions \
            -H "Content-Type: application/json" -H "Authorization: Bearer sk-invalid" \
            -d '{"model":"deepseek-chat","messages":[{"role":"user","content":"hi"}]}' \
            -w "\n[oldchat] HTTP %{http_code} in %{time_total}s\n" | head -c 200
