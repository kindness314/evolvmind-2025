name: Build Android APK

# 本地无 Android SDK 时,用此工作流出 APK(Actions -> Build Android APK -> Run workflow)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # ubuntu-latest 自带 Android SDK,无需 setup-android(v3 会因废弃的 tools 包报错)
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Decode keystore from secrets
        working-directory: android
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      - name: Assemble release APK (signed)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: evolvmind-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
